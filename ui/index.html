<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TopBar Translate</title>
<link rel="stylesheet" href="common.css" />
<link rel="stylesheet" href="panel.css" />
</head>
<body class="panel-body">
<div id="panel" class="panel">
  <header class="bar" data-drag>
    <div class="dd" id="srcDD"><button class="chip" id="srcBtn"><span id="srcLabel">自动检测</span><svg class="lucide caret" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6" /></svg></button><div class="menu" id="srcMenu"></div></div>
    <button class="icon-btn" id="swapBtn" title="交换语言"><svg class="lucide" viewBox="0 0 24 24"><path d="M8 3 4 7l4 4" /> <path d="M4 7h16" /> <path d="m16 21 4-4-4-4" /> <path d="M20 17H4" /></svg></button>
    <div class="dd" id="tgtDD"><button class="chip" id="tgtBtn"><span id="tgtLabel">中文（简体）</span><svg class="lucide caret" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6" /></svg></button><div class="menu" id="tgtMenu"></div></div>
    <div class="spacer" data-drag></div>
    <button class="icon-btn" id="pinBtn" title="固定窗口（取消自动隐藏）"><svg class="lucide" viewBox="0 0 24 24"><path d="M12 17v5" /> <path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z" /></svg></button>
    <button class="icon-btn" id="gearBtn" title="设置"><svg class="lucide" viewBox="0 0 24 24"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915" /> <circle cx="12" cy="12" r="3" /></svg></button>
    <button class="icon-btn" id="closeBtn" title="收起 (Esc)"><svg class="lucide" viewBox="0 0 24 24"><path d="M18 6 6 18" /> <path d="m6 6 12 12" /></svg></button>
  </header>

  <section class="card input-card">
    <div id="welcome" class="welcome hidden">👋 鼠标移到屏幕顶部中间就能随时唤起我；快捷键 <b id="welcomeKey"></b></div>
    <textarea id="input" placeholder="输入或粘贴需要翻译的内容，也可以直接粘贴图片..." maxlength="5000" spellcheck="false"></textarea>
    <div id="imgChip" class="img-chip hidden"><img id="imgThumb" alt="" /><span>图片翻译</span><button id="imgClear" title="移除图片">×</button></div>
    <div class="tools">
      <button class="icon-btn" id="pasteBtn" title="粘贴剪贴板文本"><svg class="lucide" viewBox="0 0 24 24"><path d="M11 14h10" /> <path d="M16 4h2a2 2 0 0 1 2 2v1.344" /> <path d="m17 18 4-4-4-4" /> <path d="M8 4H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 1.793-1.113" /> <rect x="8" y="2" width="8" height="4" rx="1" /></svg></button>
      <button class="icon-btn hidden" id="micBtn" title="语音输入（点击开始，再点结束）"><svg class="lucide" viewBox="0 0 24 24"><path d="M12 19v3" /> <path d="M19 10v2a7 7 0 0 1-14 0v-2" /> <rect x="9" y="2" width="6" height="13" rx="3" /></svg></button>
      <button class="icon-btn" id="shotBtn" title="截图翻译"><svg class="lucide" viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 0 1 2-2h2" /> <path d="M17 3h2a2 2 0 0 1 2 2v2" /> <path d="M21 17v2a2 2 0 0 1-2 2h-2" /> <path d="M7 21H5a2 2 0 0 1-2-2v-2" /> <path d="M7 8h8" /> <path d="M7 12h10" /> <path d="M7 16h6" /></svg></button>
      <span class="detected" id="detected"></span>
      <span class="counter" id="counter">0/5000</span>
      <button class="primary" id="goBtn" disabled>翻译</button>
    </div>
  </section>

  <section class="card result-card" id="resultCard">
    <div class="result" id="result"><span class="placeholder">翻译结果将显示在这里...</span></div>
    <div class="result-tools">
      <span class="meta" id="meta"></span>
      <button class="icon-btn" id="speakBtn" title="朗读"><svg class="lucide" viewBox="0 0 24 24"><path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z" /> <path d="M16 9a5 5 0 0 1 0 6" /> <path d="M19.364 18.364a9 9 0 0 0 0-12.728" /></svg></button>
      <button class="icon-btn" id="copyBtn" title="复制"><svg class="lucide" viewBox="0 0 24 24"><rect width="14" height="14" x="8" y="8" rx="2" ry="2" /> <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" /></svg></button>
      <button class="icon-btn" id="retryBtn" title="重新翻译"><svg class="lucide" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8" /> <path d="M21 3v5h-5" /></svg></button>
      <button class="icon-btn" id="expandBtn" title="展开结果"><svg class="lucide" viewBox="0 0 24 24"><path d="M15 3h6v6" /> <path d="m21 3-7 7" /> <path d="m3 21 7-7" /> <path d="M9 21H3v-6" /></svg></button>
    </div>
  </section>

  <footer class="foot">
    <div class="dd up" id="provDD"><button class="prov" id="provBtn"><span class="dot"></span><span id="provLabel">Index-Translate · 免费</span><svg class="lucide caret" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6" /></svg></button><div class="menu" id="provMenu"></div></div>
    <span class="hint" id="hint">Ctrl + Enter 翻译 · Esc 收起</span>
  </footer>
</div>
<div id="toast" class="toast"></div>
<script src="i18n-data.js"></script>
<script src="i18n.js"></script>
<script src="shared.js"></script>
<script src="panel.js"></script>
</body>
</html>
