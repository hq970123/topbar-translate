name: msix

# Builds the Microsoft Store package. Download the artifact and upload the .msix in Partner Center.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "store/**"]
  workflow_dispatch:

jobs:
  msix:
    runs-on: windows-latest
    env:
      GGML_NATIVE: "OFF"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - run: npm install
      - name: Build exe
        run: npx tauri build --no-bundle
      - name: Pack MSIX
        shell: pwsh
        run: ./packaging/msix/build-msix.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: msix
          path: dist-msix/*.msix
          if-no-files-found: error
