[package]
name = "topbar-translate"
version = "1.0.0"
description = "TopBar Translate - 鼠标触顶即可翻译的轻量桌面翻译工具"
authors = ["hq970123"]
edition = "2021"

[lib]
name = "topbar_translate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
keyring = { version = "3", features = ["apple-native", "windows-native"] }
whatlang = "0.16"
uuid = { version = "1", features = ["v4"] }
url = "2"
base64 = "0.22"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
xcap = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }
whisper-rs = "0.16"
cpal = "0.16"

[target.'cfg(windows)'.dependencies]
# MSIX (Microsoft Store) builds: launch-at-login goes through the packaged StartupTask API.
windows = { version = "0.58", features = ["ApplicationModel", "Foundation", "Foundation_Collections", "Globalization", "Graphics_Imaging", "Media_Ocr", "Storage_Streams", "Win32_UI_Input_KeyboardAndMouse"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
core-graphics = "0.24"
core-foundation = "0.10"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSDictionary", "NSError", "NSString"] }
objc2-vision = { version = "0.3", default-features = false, features = ["std", "VNRequestHandler", "VNRequest", "VNRecognizeTextRequest", "VNObservation", "VNTypes"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
